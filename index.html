<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Familie Geschiedenis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
html{color-scheme:light}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: a family album that reads sideways. Portrait row on top, one life per view as a horizontal
   filmstrip of "pages" along a life line with year markers; lightbox to open a memory. */
:root{
  --bg:#e9ece5; --surface:#f6f7f2; --sunk:#dfe3da; --ink:#1b201d; --muted:#5b655f; --line:#c9cfc4;
  --accent:#8a5c12; --accent-ink:#fff8ec; --shade:rgba(20,26,22,.12); --scrim:rgba(14,18,16,.82);
  --danger:#a2372b;
  --p1:#8a5c12; --p2:#2f6a5a; --p3:#7a3f5e; --p4:#3c5a8c; --p5:#8d4a2a; --p6:#5c6b1f;
  --f-display:"Gloock","Iowan Old Style","Georgia",serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --card-w:clamp(240px,74vw,320px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111412; --surface:#191d1a; --sunk:#0c0e0d; --ink:#e7eae4; --muted:#97a19a; --line:#2b312d;
  --accent:#e2ad52; --accent-ink:#1a1408; --shade:rgba(0,0,0,.45); --scrim:rgba(4,6,5,.9);
  --danger:#e07a6c;
  --p1:#e2ad52; --p2:#6cc0a6; --p3:#d68bb0; --p4:#8fb0e6; --p5:#e39672; --p6:#b7c768;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111412; --surface:#191d1a; --sunk:#0c0e0d; --ink:#e7eae4; --muted:#97a19a; --line:#2b312d;
  --accent:#e2ad52; --accent-ink:#1a1408; --shade:rgba(0,0,0,.45); --scrim:rgba(4,6,5,.9);
  --danger:#e07a6c;
  --p1:#e2ad52; --p2:#6cc0a6; --p3:#d68bb0; --p4:#8fb0e6; --p5:#e39672; --p6:#b7c768;
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1200px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible,.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-variant-numeric:tabular-nums}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 8px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand .mark{font-family:var(--f-display);font-size:22px}
.brand .mono{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:500;font-size:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn[disabled]{opacity:.5;cursor:default}
.actions{display:flex;gap:8px;flex-wrap:wrap}

/* portrait row */
.people{display:flex;gap:6px;overflow-x:auto;padding-block:14px 16px;scrollbar-width:thin;border-bottom:1px solid var(--line)}
.who{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:6px 8px;border-radius:12px;width:92px}
.who .face{width:58px;height:58px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;overflow:hidden;
  font-family:var(--f-display);font-size:22px;color:var(--muted);box-shadow:0 0 0 2px var(--bg),0 0 0 3px transparent;transition:box-shadow .2s}
.who .face img{width:100%;height:100%;object-fit:cover}
.who .nm{font-size:13px;font-weight:500;line-height:1.2;text-align:center;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .yr{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.who[aria-current="true"] .face{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--c,var(--accent))}
.who[aria-current="true"] .nm{color:var(--ink)}
.who:hover .face{box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--line)}
.who.add .face{border:1.5px dashed var(--line);background:transparent;font-family:var(--f-body);font-size:26px}
.who.all .face{background:var(--ink);color:var(--bg);font-size:13px;font-family:var(--f-mono);letter-spacing:.04em}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;padding-block:40px 28px}
.hero .eyebrow{color:var(--muted);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}
.hero h1{font-size:clamp(40px,8vw,92px);line-height:.95}
.hero .span{font-family:var(--f-display);font-size:clamp(22px,3.4vw,34px);color:var(--muted);margin-top:8px;font-variant-numeric:lining-nums}
.hero p.bio{max-width:62ch;margin:16px 0 0;color:var(--ink)}
.hero .portrait{width:clamp(110px,18vw,190px);aspect-ratio:4/5;border-radius:4px;overflow:hidden;background:var(--sunk);box-shadow:0 18px 40px -18px var(--shade);transform:rotate(1.5deg)}
.hero .portrait img{width:100%;height:100%;object-fit:cover;display:block}
.hero .actions{margin-top:18px}
@media (max-width:620px){.hero{grid-template-columns:1fr}.hero .portrait{order:-1;width:120px}}

/* filmstrip */
.strip-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.strip-head .mono{color:var(--muted)}
.nav{display:flex;gap:6px}
.nav button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.nav button:hover{border-color:var(--ink)}
.strip{overflow-x:auto;overscroll-behavior-x:contain;padding-block:6px 10px;margin-inline:-4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
.rail{display:flex;align-items:flex-start;gap:18px;width:max-content;position:relative;padding:0 4px 56px}
.rail::after{content:"";position:absolute;left:0;right:0;bottom:26px;height:1px;background:var(--line)}
.yr-mark{scroll-snap-align:start;flex:0 0 auto;align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;padding-right:4px;position:relative}
.yr-mark .big{font-family:var(--f-display);font-size:64px;line-height:.9;writing-mode:vertical-rl;transform:rotate(180deg);color:var(--ink)}
.yr-mark .age{position:absolute;bottom:-44px;left:0;white-space:nowrap;color:var(--muted)}
.yr-mark::after{content:"";position:absolute;bottom:-34px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--ink)}

.card{scroll-snap-align:start;flex:0 0 auto;width:var(--card-w);background:var(--surface);border-radius:6px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .25s ease,box-shadow .25s ease;position:relative;text-align:left;padding:0}
.card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 22px 40px -22px var(--shade)}
.card .ph{aspect-ratio:4/5;background:var(--sunk);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .count{position:absolute;right:10px;bottom:10px;background:var(--scrim);color:#fff;border-radius:999px;padding:3px 9px;font-size:11px}
.card .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px}
.card .meta{color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.card .meta .ag{color:var(--accent)}
.card h3{font-size:22px;line-height:1.15}
.card .ex{color:var(--muted);font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.card.text .body{padding:22px 20px;min-height:220px;justify-content:flex-end;background:linear-gradient(var(--surface),var(--surface))}
.card.text h3{font-size:28px}
.card.text .ex{-webkit-line-clamp:6}
.card .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--sunk);display:inline-flex;align-items:center;gap:6px}
.tag i{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent));display:inline-block}
.card::after{content:"";position:absolute;bottom:-1px;left:0;right:0;height:3px;background:var(--c,transparent)}

.event{scroll-snap-align:start;flex:0 0 auto;width:200px;align-self:stretch;border-left:1px solid var(--ink);padding:4px 0 0 14px;display:flex;flex-direction:column;gap:4px}
.event .mono{color:var(--muted)}
.event h3{font-size:26px;line-height:1.1}
.event p{margin:0;color:var(--muted);font-size:14px}
.add-card{scroll-snap-align:start;flex:0 0 auto;width:180px;align-self:stretch;min-height:240px;border:1.5px dashed var(--line);border-radius:6px;background:transparent;display:grid;place-items:center;color:var(--muted);text-align:center;padding:16px}
.add-card:hover{border-color:var(--accent);color:var(--accent)}
.add-card b{display:block;font-family:var(--f-display);font-size:40px;font-weight:400;line-height:1}

.years{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.years button{border:0;background:none;padding:4px 8px;border-radius:6px;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.years button:hover{background:var(--sunk);color:var(--ink)}
.years .dec{color:var(--ink);font-weight:500}

/* view toggle */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.seg button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* slinger: one winding line down the page, memories alternate left and right */
.sl{position:relative;padding-block:24px 64px}
.sl-svg{position:absolute;left:0;top:0;width:100%;overflow:visible;pointer-events:none}
.sl-base{fill:none;stroke:var(--line);stroke-width:2}
.sl-prog{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dashoffset .12s linear}
.sl-dots circle{stroke:var(--bg);stroke-width:3}
.sl-items{position:relative;display:flex;flex-direction:column;gap:36px}
.sl-item{width:min(44%,380px);position:relative}
.sl-item.l{align-self:flex-start;margin-left:3%}
.sl-item.r{align-self:flex-end;margin-right:3%}
.sl-item .card{width:100%}
.sl-item .card:hover{transform:translateY(-3px)}
.sl-item .event{width:auto;border-left:0;padding:10px 0;background:var(--bg)}
.sl-item.l .event{text-align:right;align-items:flex-end}
.sl-item .add-card{width:100%;min-height:160px}
.sl-year{align-self:center;display:flex;flex-direction:column;align-items:center;background:var(--bg);padding:6px 14px;position:relative;z-index:1}
.sl-year .big{font-family:var(--f-display);font-size:clamp(48px,7vw,84px);line-height:1}
.sl-year .mono{color:var(--accent)}
@media (max-width:719px){
  .sl-item,.sl-item.l,.sl-item.r{align-self:stretch;width:auto;margin:0 0 0 44px}
  .sl-item.l .event{text-align:left;align-items:flex-start}
  .sl-year{align-self:flex-start;margin-left:30px;align-items:flex-start;padding-left:4px}
}

/* empty + notices */
.empty{padding-block:56px 32px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:40px;align-items:center}
.empty h1{font-size:clamp(40px,7vw,80px);line-height:.95}
.empty p{max-width:52ch;color:var(--muted)}
.steps{list-style:none;padding:0;margin:20px 0 24px;display:grid;gap:10px;counter-reset:s}
.steps li{display:flex;gap:12px;align-items:baseline;counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-mono);font-size:12px;color:var(--accent);border:1px solid var(--accent);border-radius:50%;width:22px;height:22px;display:inline-grid;place-items:center;flex:0 0 auto}
.ghost-strip{display:flex;gap:14px;transform:rotate(-3deg);opacity:.9}
.ghost-strip div{flex:1;aspect-ratio:4/5;border-radius:6px;background:var(--sunk);border:1px solid var(--line);position:relative}
.ghost-strip div:nth-child(2){transform:translateY(22px)}
.ghost-strip div span{position:absolute;left:10px;bottom:10px;font-family:var(--f-display);font-size:28px;color:var(--muted)}
@media (max-width:720px){.empty{grid-template-columns:1fr}}
.note{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:12px 16px;color:var(--muted);margin-top:16px;font-size:14px}
.nothing{color:var(--muted);padding:24px 0}

/* overlays */
.ov{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);color:var(--ink);border-radius:10px;width:min(620px,100%);padding:24px;box-shadow:0 30px 80px -20px rgba(0,0,0,.5)}
.sheet h2{font-size:30px;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label,.lbl{font-size:13px;font-weight:600}
.field small{color:var(--muted);font-size:12px}
.field input[type=text],.field input[type=number],.field textarea,.field select{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:9px 11px;font:inherit}
.field textarea{min-height:120px;resize:vertical}
.row3{display:grid;grid-template-columns:1.2fr 1.4fr .9fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:4px 10px 4px 8px;font-size:13px;cursor:pointer;font-weight:500}
.chips input{accent-color:var(--accent)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs .t{width:76px;height:76px;border-radius:6px;overflow:hidden;position:relative;background:var(--sunk)}
.thumbs .t img{width:100%;height:100%;object-fit:cover}
.thumbs .t button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:var(--scrim);color:#fff;font-size:13px;line-height:1}
.thumbs .t .mk{left:3px;right:auto;font-size:12px}
.thumbs .t .mk:hover{background:var(--accent);color:var(--accent-ink)}
.thumbs .t.cover::after{content:"omslag";position:absolute;left:0;right:0;bottom:0;background:var(--accent);color:var(--accent-ink);font-size:10px;text-align:center;font-family:var(--f-mono);text-transform:uppercase}
.drop{border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.drop.on{border-color:var(--accent);color:var(--accent)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;align-items:center}
.more summary{cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;list-style:none;padding:4px 0;width:max-content}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:8px}
.more .row3{margin-bottom:6px}
.status{font-size:13px;color:var(--muted);min-height:1.2em}
.status.err{color:var(--danger)}

/* lightbox */
.lb{position:fixed;inset:0;z-index:60;background:var(--scrim);display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,380px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.lb .stage{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;padding:16px}
.lb .main{flex:1;display:grid;place-items:center;min-height:0}
.lb .main img{max-width:100%;max-height:calc(100vh - 150px);object-fit:contain;border-radius:3px;box-shadow:0 30px 60px -20px #000}
.lb .noimg{font-family:var(--f-display);font-size:clamp(36px,6vw,72px);color:#e7eae4;text-align:center;max-width:16ch}
.lb .film{display:flex;gap:6px;overflow-x:auto;padding-top:12px;justify-content:center}
.lb .film button{flex:0 0 auto;width:56px;height:56px;border:2px solid transparent;border-radius:4px;padding:0;overflow:hidden;background:#000;opacity:.6}
.lb .film button[aria-current="true"]{border-color:#fff;opacity:1}
.lb .film img{width:100%;height:100%;object-fit:cover}
.lb aside{background:var(--surface);color:var(--ink);padding:24px 22px;overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.lb aside h2{font-size:34px;line-height:1.05}
.lb aside .txt{white-space:pre-wrap;margin:0}
.lb .x{position:absolute;top:12px;left:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;z-index:2}
.lb .pn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;z-index:2}
.lb .pn.l{left:12px}.lb .pn.r{right:12px}
.lb .pn:hover,.lb .x:hover{background:rgba(255,255,255,.28)}
.lb .memnav{display:flex;gap:8px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line)}
@media (max-width:760px){.lb{grid-template-columns:1fr;grid-template-rows:minmax(0,58vh) auto;overflow-y:auto}.lb .main img{max-height:46vh}.lb aside{border-radius:12px 12px 0 0}}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:80;transition:opacity .3s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="mark" id="site-name">Onze familie</span><span class="mono" id="site-count"></span></div>
    <div class="actions" id="top-actions"></div>
  </header>
  <nav class="people" id="people" aria-label="Familieleden"></nav>
  <main id="main">
    <section class="empty">
      <div>
        <div class="mono" style="color:var(--muted)">Familiealbum</div>
        <h1>Het album wordt geopend…</h1>
        <p>De foto's en verhalen van de familie worden geladen.</p>
      </div>
      <div class="ghost-strip" aria-hidden="true"><div><span>19··</span></div><div></div><div></div></div>
    </section>
  </main>
</div>
<div id="layer"></div>

<script>
(function(){
const MONTHS=["jan","feb","mrt","apr","mei","jun","jul","aug","sep","okt","nov","dec"];
const MONTHS_FULL=["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
let LAYOUT="slinger";try{LAYOUT=localStorage.getItem("layout")||"slinger"}catch(e){}
const S={layout:LAYOUT,people:[],memories:[],site:{title:"Onze familie",subtitle:""},view:"all",db:null,assets:null,canEdit:false,ready:{p:false,m:false},offline:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const URLS={};const BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const img=id=>id?(URLS[id]||BLANK):"";

/* ---------- dates ---------- */
function parseD(s){if(!s)return null;const m=String(s).match(/^(\d{4})(?:-(\d{2}))?(?:-(\d{2}))?/);if(!m)return null;return{y:+m[1],m:m[2]?+m[2]:null,d:m[3]?+m[3]:null}}
function fmtD(s,long){const p=parseD(s);if(!p)return"";const M=long?MONTHS_FULL:MONTHS;if(p.d)return p.d+" "+M[p.m-1]+" "+p.y;if(p.m)return M[p.m-1]+" "+p.y;return String(p.y)}
function mkD(y,m,d){y=String(y||"").trim();if(!/^\d{4}$/.test(y))return"";let s=y;if(m){s+="-"+String(m).padStart(2,"0");if(d)s+="-"+String(d).padStart(2,"0")}return s}
function ageAt(born,at){const b=parseD(born),a=parseD(at);if(!b||!a)return null;let age=a.y-b.y;
  if(b.m&&a.m){if(a.m<b.m||(a.m===b.m&&b.d&&a.d&&a.d<b.d))age--}return age}
function ageLabel(age){if(age==null)return"";if(age<0)return"voor de geboorte";if(age===0)return"eerste levensjaar";return age+" jaar"}
function fmtR(a,b,long){const A=parseD(a),B=parseD(b);if(!A)return"";if(!B||b===a)return fmtD(a,long);const M=long?MONTHS_FULL:MONTHS,D="–";
  if(A.y!==B.y)return fmtD(a,long)+" "+D+" "+fmtD(b,long);
  if(A.m&&B.m&&A.m===B.m&&A.d&&B.d)return A.d+D+B.d+" "+M[A.m-1]+" "+A.y;
  if(A.m&&B.m&&A.m!==B.m)return(A.d&&B.d?A.d+" "+M[A.m-1]+" "+D+" "+B.d+" "+M[B.m-1]:M[A.m-1]+" "+D+" "+M[B.m-1])+" "+A.y;
  return fmtD(a,long)+" "+D+" "+fmtD(b,long)}
function ageR(born,a,b){const x=ageAt(born,a);if(x==null)return"";const y=b?ageAt(born,b):x;return y!=null&&y>x&&x>=0?x+"–"+y+" jaar":ageLabel(x)}
const cmpDate=(a,b)=>String(a.date||"").localeCompare(String(b.date||""))||String(a.createdAt||"").localeCompare(String(b.createdAt||""));

/* ---------- people helpers ---------- */
function peopleSorted(){return S.people.slice().sort((a,b)=>String(a.born||"9999").localeCompare(String(b.born||"9999"))||String(a.name).localeCompare(String(b.name)))}
function colorOf(id){const i=peopleSorted().findIndex(p=>p.id===id);return"var(--p"+((i<0?0:i)%6+1)+")"}
function person(id){return S.people.find(p=>p.id===id)}
function initials(n){return String(n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase()}
function lifeSpan(p){const b=parseD(p.born),d=parseD(p.died);if(!b)return"";return b.y+" — "+(d?d.y:"")}

/* ---------- render ---------- */
function render(){
  renderTop();renderPeople();
  if(S.gate){$("#people").hidden=true;$("#main").innerHTML=S.gate;bindGate();return}
  const main=$("#main");
  if(S.offline){main.innerHTML=offlineHTML();return}
  if(!(S.ready.p&&S.ready.m))return;
  if(!S.people.length){main.innerHTML=emptyHTML();bindEmpty();return}
  if(S.view!=="all"&&!person(S.view))S.view="all";
  const old=$("#strip"),keep=old&&main.dataset.v===S.view?old.scrollLeft:0;
  main.innerHTML=S.view==="all"?allHTML():personHTML(person(S.view));main.dataset.v=S.view;
  bindMain();if(keep){const ns=$("#strip");ns.style.scrollBehavior="auto";ns.scrollLeft=keep;ns.style.scrollBehavior=""}
}
function renderTop(){
  $("#site-name").textContent=S.site.title||"Onze familie";

  $("#site-count").textContent=S.people.length?S.people.length+" personen · "+n+(n===1?" herinnering":" herinneringen"):"";

  a.innerHTML=(S.canEdit&&S.people.length?'<button class="btn ghost" id="b-site" type="button">Titel</button><button class="btn primary" id="b-addmem" type="button">+ Herinnering</button>':"")
    +(S.role==="admin"?'<button class="btn ghost" id="b-acc" type="button">Toegang</button>':"")+'<button class="btn ghost" id="b-out" type="button" title="'+esc(S.user.email)+'">Uitloggen</button>';
  if(S.canEdit&&S.people.length){$("#b-addmem").onclick=()=>openMemory(null,S.view!=="all"?[S.view]:[]);$("#b-site").onclick=openSite}
  if(S.role==="admin")$("#b-acc").onclick=openAccess;
  $("#b-out").onclick=async()=>{await SB.auth.signOut();location.reload()};
}
function renderPeople(){
  const nav=$("#people");
  if(!S.people.length&&!S.canEdit){nav.hidden=true;return}
  nav.hidden=!S.people.length;
  let h='<button class="who all" type="button" data-view="all" aria-current="'+(S.view==="all")+'"><span class="face">ALLE</span><span class="nm">Iedereen</span><span class="yr">tijdlijn</span></button>';
  for(const p of peopleSorted()){
    const b=parseD(p.born);
    h+='<button class="who" type="button" data-view="'+esc(p.id)+'" style="--c:'+colorOf(p.id)+'" aria-current="'+(S.view===p.id)+'"><span class="face">'+(p.portrait?'<img alt="" loading="lazy" src="'+img(p.portraitThumb||p.portrait)+'">':esc(initials(p.name)))+'</span><span class="nm">'+esc(p.name)+'</span><span class="yr">'+(b?"°"+b.y:"&nbsp;")+'</span></button>';
  }

  nav.innerHTML=h;
  nav.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>go(b.dataset.view));

function go(v){S.view=v;try{history.replaceState(null,"",v==="all"?location.pathname+location.search:"#p-"+v)}catch(e){}render();window.scrollTo({top:0,behavior:"smooth"})}

/* entries: memories + birth/death events, sorted */
function entriesFor(pid){
  const list=[];
  const mems=S.memories.filter(m=>pid==="all"||(m.personIds||[]).includes(pid));
  for(const m of mems)list.push({kind:"mem",date:m.date,createdAt:m.createdAt,m});
  const ps=pid==="all"?S.people:[person(pid)];
  for(const p of ps){if(!p)continue;
    if(p.born)list.push({kind:"born",date:p.born,createdAt:"0",p});
    if(p.died)list.push({kind:"died",date:p.died,createdAt:"z",p});}
  list.sort(cmpDate);return list;
}
function stripHTML(entries,pid){
  const p=pid!=="all"?person(pid):null;let h="",lastY=null;const years=[];
  for(const e of entries){
    const d=parseD(e.date);const y=d?d.y:null;
    if(y!==lastY&&y!=null){lastY=y;years.push(y);
      const ag=p?ageLabel(ageAt(p.born,String(y))):"";
      h+='<div class="yr-mark" data-year="'+y+'"><span class="big">'+y+'</span>'+(ag&&e.kind!=="born"?'<span class="age mono">'+esc(ag)+'</span>':"")+'</div>';}
    if(e.kind==="born")h+='<div class="event"><span class="mono">'+esc(fmtD(e.date,true))+'</span><h3>'+(pid==="all"?esc(e.p.name)+" wordt geboren":"Geboren")+'</h3>'+(e.p.birthplace?'<p>'+esc(e.p.birthplace)+'</p>':"")+'</div>';
    else if(e.kind==="died")h+='<div class="event"><span class="mono">'+esc(fmtD(e.date,true))+'</span><h3>'+(pid==="all"?esc(e.p.name)+" overlijdt":"Overleden")+'</h3><p>'+esc(ageLabel(ageAt(e.p.born,e.date)))+'</p></div>';
    else h+=cardHTML(e.m,p);
  }
  if(S.canEdit)h+='<button class="add-card" type="button" id="s-add"><span><b>+</b>Herinnering toevoegen</span></button>';
  return{h,years};
}
function cardHTML(m,p){
  const ph=(m.photos||[])[0];const ag=p?ageR(p.born,m.date,m.dateEnd):"";
  const tags=!p&&(m.personIds||[]).length?'<div class="tags">'+m.personIds.map(id=>person(id)).filter(Boolean).map(x=>'<span class="tag" style="--c:'+colorOf(x.id)+'"><i></i>'+esc(x.name.split(" ")[0])+'</span>').join("")+'</div>':"";
  const c=p?colorOf(p.id):(m.personIds&&m.personIds.length===1?colorOf(m.personIds[0]):"transparent");
  return'<button type="button" class="card'+(ph?"":" text")+'" data-mem="'+esc(m.id)+'" style="--c:'+c+'">'
   +(ph?'<div class="ph"><img loading="lazy" alt="" src="'+img(prev(m,ph))+'">'+((m.photos||[]).length>1?'<span class="count mono">'+m.photos.length+' foto\'s</span>':"")+'</div>':"")
   +'<div class="body"><div class="meta mono"><span>'+esc(fmtR(m.date,m.dateEnd))+'</span>'+(ag?'<span class="ag">'+esc(ag)+'</span>':"")+(m.place?'<span>'+esc(m.place)+'</span>':"")+'</div>'
   +'<h3>'+esc(m.title||"Zonder titel")+'</h3>'+(m.text?'<p class="ex">'+esc(m.text)+'</p>':"")+tags+'</div></button>';
}
function yearsHTML(years){
  if(years.length<4)return"";let lastDec=null;
  return'<div class="years" aria-label="Spring naar jaar">'+years.map(y=>{const dec=Math.floor(y/10)*10;const isDec=dec!==lastDec;lastDec=dec;return'<button type="button" data-jump="'+y+'" class="'+(isDec?"dec":"")+'">'+y+'</button>'}).join("")+'</div>';
}
function allHTML(){
  const ents=entriesFor("all");const{h,years}=stripHTML(ents,"all");
  const span=years.length?years[0]+" — "+years[years.length-1]:"";
  return'<section class="hero"><div><div class="eyebrow mono"><span>Familietijdlijn</span>'+(span?'<span>'+span+'</span>':"")+'</div><h1>'+esc(S.site.title||"Onze familie")+'</h1>'
   +(S.site.subtitle?'<p class="bio">'+esc(S.site.subtitle)+'</p>':'<p class="bio" style="color:var(--muted)">Alle levens naast elkaar, van oud naar nieuw. Kies bovenaan een persoon om één levensverhaal te volgen.</p>')+'</div></section>'
   +stripWrap(h,years,ents,"all");
}
function personHTML(p){
  const ents=entriesFor(p.id);const{h,years}=stripHTML(ents,p.id);
  const n=S.memories.filter(m=>(m.personIds||[]).includes(p.id)).length;
  const eb=[p.relation,p.birthplace].filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join("");
  return'<section class="hero"><div><div class="eyebrow mono">'+eb+'<span>'+n+(n===1?" herinnering":" herinneringen")+'</span></div><h1>'+esc(p.name)+'</h1>'
   +(lifeSpan(p)?'<div class="span">'+esc(lifeSpan(p))+'</div>':"")+(p.bio?'<p class="bio">'+esc(p.bio)+'</p>':"")
   +(S.canEdit?'<div class="actions"><button class="btn" type="button" id="b-editp">Persoon bewerken</button></div>':"")+'</div>'
   +(p.portrait?'<div class="portrait"><img alt="Portret van '+esc(p.name)+'" src="'+img(p.portrait)+'"></div>':"")+'</section>'
   +stripWrap(h,years,ents,p.id);
}
function layoutToggle(){return'<div class="seg" role="group" aria-label="Weergave"><button type="button" data-layout="slinger" aria-pressed="'+(S.layout==="slinger")+'">Slinger</button><button type="button" data-layout="strip" aria-pressed="'+(S.layout==="strip")+'">Zijwaarts</button></div>'}
function slingerWrap(entries,pid){
  const p=pid!=="all"?person(pid):null;let h="",lastY=null,side=0;
  for(const e of entries){
    const d=parseD(e.date);const y=d?d.y:null;
    if(y!==lastY&&y!=null){lastY=y;const ag=p&&e.kind!=="born"?ageLabel(ageAt(p.born,String(y))):"";
      h+='<div class="sl-year" data-year="'+y+'"><span class="big">'+y+'</span>'+(ag?'<span class="mono">'+esc(ag)+'</span>':"")+'</div>';}
    const sd=(side++%2)?"r":"l";
    if(e.kind==="born")h+='<div class="sl-item '+sd+'"><div class="event"><span class="mono">'+esc(fmtD(e.date,true))+'</span><h3>'+(pid==="all"?esc(e.p.name)+" wordt geboren":"Geboren")+'</h3>'+(e.p.birthplace?'<p>'+esc(e.p.birthplace)+'</p>':"")+'</div></div>';
    else if(e.kind==="died")h+='<div class="sl-item '+sd+'"><div class="event"><span class="mono">'+esc(fmtD(e.date,true))+'</span><h3>'+(pid==="all"?esc(e.p.name)+" overlijdt":"Overleden")+'</h3><p>'+esc(ageLabel(ageAt(e.p.born,e.date)))+'</p></div></div>';
    else h+='<div class="sl-item '+sd+'">'+cardHTML(e.m,p)+'</div>';
  }
  if(S.canEdit)h+='<div class="sl-item '+((side%2)?"r":"l")+'"><button class="add-card" type="button" id="s-add"><span><b>+</b>Herinnering toevoegen</span></button></div>';
  return'<div class="sl" id="sl"><svg class="sl-svg" aria-hidden="true"><path class="sl-base"/><path class="sl-prog"/><g class="sl-dots"></g></svg><div class="sl-items">'+h+'</div></div>';
}
function stripWrap(h,years,entries,pid){
  if(S.layout==="slinger")return'<section aria-label="Tijdlijn"><div class="strip-head"><span class="mono">Scroll door de tijd ↓</span>'+layoutToggle()+'</div>'+slingerWrap(entries,pid)
   +(S.memories.length===0?'<p class="nothing">Nog geen herinneringen.</p>':"")+'</section>';
  return'<section aria-label="Tijdlijn"><div class="strip-head"><span class="mono">Blader door de tijd →</span><div class="actions" style="align-items:center">'+layoutToggle()+'<div class="nav"><button type="button" id="s-prev" aria-label="Terug in de tijd">←</button><button type="button" id="s-next" aria-label="Verder in de tijd">→</button></div></div></div>'
   +'<div class="strip" id="strip" tabindex="0"><div class="rail">'+h+'</div></div>'+yearsHTML(years)
   +(S.memories.length===0?'<p class="nothing">Nog geen herinneringen. '+(S.canEdit?'Voeg de eerste toe met de knop aan het eind van de tijdlijn.':'')+'</p>':"")+'</section>';
}
function bindMain(){
  document.querySelectorAll("[data-layout]").forEach(b=>b.onclick=()=>{S.layout=b.dataset.layout;try{localStorage.setItem("layout",S.layout)}catch(e){}$("#main").dataset.v="";render()});
  $("#main").querySelectorAll("[data-mem]").forEach(b=>b.onclick=()=>openLightbox(b.dataset.mem));
  if(S.layout==="slinger")bindSlinger();else bindStrip();
  const sa=$("#s-add");if(sa)sa.onclick=()=>openMemory(null,S.view!=="all"?[S.view]:[]);
  const ep=$("#b-editp");if(ep)ep.onclick=()=>openPerson(person(S.view));
}
const REDUCED=matchMedia("(prefers-reduced-motion: reduce)").matches;
function bindStrip(){
  const strip=$("#strip");if(!strip)return;
  /* smooth wheel: glide toward a target instead of jumping per wheel tick */
  let target=strip.scrollLeft,raf=0;
  const max=()=>strip.scrollWidth-strip.clientWidth;
  const glide=()=>{const d=target-strip.scrollLeft;if(Math.abs(d)<.5||REDUCED){strip.scrollLeft=target;raf=0;return}strip.scrollLeft+=d*.16;raf=requestAnimationFrame(glide)};
  const go=t=>{target=Math.max(0,Math.min(max(),t));if(!raf)raf=requestAnimationFrame(glide)};
  strip.addEventListener("scroll",()=>{if(!raf)target=strip.scrollLeft},{passive:true});
  const step=dir=>{const c=strip.querySelector(".card,.event");const w=c?c.getBoundingClientRect().width+18:300;go((raf?target:strip.scrollLeft)+dir*w)};
  $("#s-prev").onclick=()=>step(-1);$("#s-next").onclick=()=>step(1);
  strip.addEventListener("keydown",e=>{if(e.key==="ArrowRight"){e.preventDefault();step(1)}if(e.key==="ArrowLeft"){e.preventDefault();step(-1)}});
  strip.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)&&!e.shiftKey&&max()>0){
    const cur=raf?target:strip.scrollLeft;const atStart=cur<=0&&e.deltaY<0,atEnd=cur>=max()-1&&e.deltaY>0;
    if(!atStart&&!atEnd){e.preventDefault();go(cur+e.deltaY*(e.deltaMode===1?40:1)*1.1)}}},{passive:false});
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>{const t=strip.querySelector('[data-year="'+b.dataset.jump+'"]');if(t)go(t.offsetLeft-4)});
}
let slCleanup=null;
function bindSlinger(){
  if(slCleanup)slCleanup();
  const sl=$("#sl");if(!sl)return;
  const svg=sl.querySelector("svg"),base=svg.querySelector(".sl-base"),prog=svg.querySelector(".sl-prog"),dots=svg.querySelector(".sl-dots");
  let len=0;
  const draw=()=>{
    if(!sl.isConnected){if(slCleanup)slCleanup();return}
    const W=sl.clientWidth,H=sl.scrollHeight,narrow=W<720,sb=sl.getBoundingClientRect();
    svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.style.height=H+"px";
    const pts=[{x:narrow?18:W/2,y:0}];let dh="";
    sl.querySelectorAll(".sl-item,.sl-year").forEach(el=>{
      const b=el.getBoundingClientRect(),y=b.top-sb.top+Math.min(b.height/2,140);
      let x=W/2;
      if(narrow)x=18;
      else if(el.classList.contains("l"))x=b.right-sb.left+34;
      else if(el.classList.contains("r"))x=b.left-sb.left-34;
      pts.push({x,y,el});
      const c=el.querySelector(".card");
      if(!el.classList.contains("sl-year"))dh+='<circle cx="'+x+'" cy="'+y+'" r="5" style="fill:'+(c&&c.style.getPropertyValue("--c")&&c.style.getPropertyValue("--c")!=="transparent"?c.style.getPropertyValue("--c"):"var(--ink)")+'"/>';
    });
    pts.push({x:narrow?18:W/2,y:H});
    let d="M"+pts[0].x+" "+pts[0].y;
    for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i],m=(b.y-a.y)*.55;d+=" C"+a.x+" "+(a.y+m)+" "+b.x+" "+(b.y-m)+" "+b.x+" "+b.y}
    base.setAttribute("d",d);prog.setAttribute("d",d);dots.innerHTML=dh;
    len=prog.getTotalLength();prog.style.strokeDasharray=len;progress();
  };
  const progress=()=>{
    if(!len)return;const b=sl.getBoundingClientRect(),vh=innerHeight;
    const f=Math.max(0,Math.min(1,(vh*.75-b.top)/b.height));
    prog.style.strokeDashoffset=REDUCED?0:len*(1-f);
  };
  let q=0;const sched=()=>{if(!q)q=requestAnimationFrame(()=>{q=0;draw()})};
  const ro=new ResizeObserver(sched);ro.observe(sl.querySelector(".sl-items"));
  sl.querySelectorAll("img").forEach(i=>i.addEventListener("load",sched,{once:true}));
  addEventListener("scroll",progress,{passive:true});addEventListener("resize",sched);
  slCleanup=()=>{ro.disconnect();removeEventListener("scroll",progress);removeEventListener("resize",sched);slCleanup=null};
  draw();
  const sa=$("#s-add");if(sa)sa.onclick=()=>openMemory(null,S.view!=="all"?[S.view]:[]);
  const ep=$("#b-editp");if(ep)ep.onclick=()=>openPerson(person(S.view));
}

/* photos: the original is stored untouched; a small preview copy keeps the timeline fast */
async function shrink(file,max,q){const bmp=await createImageBitmap(file);const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);const b=await new Promise(res=>c.toBlob(res,"image/jpeg",q));if(!b)throw new Error("encode");return b}
async function upload(file){
  if(!S.assets)throw{code:"not_granted"};
  let orig=file;
  if(file.size>19.5*1024*1024){try{orig=await shrink(file,6000,.95)}catch(e){throw{code:"too_large"}}}
  const r=await S.assets.upload(orig);
  let thumb="";try{thumb=(await S.assets.upload(await shrink(file,1000,.82))).id}catch(e){}
  return{id:r.id,thumb}}
const prev=(o,id)=>(o&&o.thumbs&&o.thumbs[id])||id;
function errText(e){const c=e&&e.code;
  if(c==="not_granted"||c==="permission_denied")return"Je hebt geen rechten om dit album te bewerken.";
  if(c==="too_large"||c==="payload_too_large")return"Deze foto is te groot om op te slaan, ook na verkleinen. Probeer een kleinere versie.";
  if(c==="quota_exceeded")return"De opslag van het album is vol. Verwijder oude foto's om ruimte te maken.";
  if(c==="invalid_request")return"Dit bestandstype wordt niet ondersteund. Gebruik JPG, PNG of WebP.";
  return"Opslaan is niet gelukt. Controleer je verbinding en probeer het opnieuw."}

let LB={list:[],i:0,ph:0};
function lbKeys(e){if(e.key==="Escape")closeLayer();else if(e.key==="ArrowRight")lbPhoto(1);else if(e.key==="ArrowLeft")lbPhoto(-1)}
function openLightbox(id){
  LB.list=entriesFor(S.view).filter(e=>e.kind==="mem").map(e=>e.m);LB.i=Math.max(0,LB.list.findIndex(m=>m.id===id));LB.ph=0;
  openLayer('<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Herinnering"></div>');

function lbPhoto(d){const m=LB.list[LB.i];const n=(m.photos||[]).length;
  if(n>1&&LB.ph+d>=0&&LB.ph+d<n){LB.ph+=d;drawLB();return}
  const j=LB.i+d;if(j>=0&&j<LB.list.length){LB.i=j;LB.ph=d>0?0:Math.max(0,(LB.list[j].photos||[]).length-1);drawLB()}}
function drawLB(){
  const m=LB.list[LB.i];if(!m){closeLayer();return}const ph=m.photos||[];
  if(ph[LB.ph]&&!URLS[ph[LB.ph]]){sign([ph[LB.ph]]).then(()=>{if($("#lb"))drawLB()})}const p=S.view!=="all"?person(S.view):null;const ag=p?ageR(p.born,m.date,m.dateEnd):"";

  $("#lb-x").onclick=closeLayer;$("#lb-p").onclick=()=>lbPhoto(-1);$("#lb-n").onclick=()=>lbPhoto(1);

/* ---------- Supabase backend ---------- */
const CFG=window.ALBUM_CONFIG||{};let SB=null;
const TBL={people:"people",memories:"memories",site:"site"};
function rid(){return(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,"").slice(0,16)}
function fail(error){if(error){const e=new Error(error.message);e.code=error.statusCode==413||/exceeded|too large/i.test(error.message)?"too_large":/row-level|permission|not allowed|unauthori/i.test(error.message)?"not_granted":"upstream";throw e}}
const DB={
  doc(path){const[c,id]=path.split("/");const t=TBL[c];return{
    async get(){const{data,error}=await SB.from(t).select("data").eq("id",id).maybeSingle();fail(error);return data?data.data:null},
    async set(d){const{error}=await SB.from(t).upsert({id,data:d});fail(error);await reload()},
    async update(d){const cur=await this.get()||{};const{error}=await SB.from(t).upsert({id,data:{...cur,...d}});fail(error);await reload()},
    async delete(){const{error}=await SB.from(t).delete().eq("id",id);fail(error);await reload()}}},
  collection(c){const t=TBL[c];return{async add(d){const id=rid();const{error}=await SB.from(t).insert({id,data:d});fail(error);await reload();return{id}}}}
};
const STORE={async upload(blob){const ext=/png/.test(blob.type)?"png":/webp/.test(blob.type)?"webp":/gif/.test(blob.type)?"gif":"jpg";
  const path=rid()+"."+ext;const{error}=await SB.storage.from("photos").upload(path,blob,{contentType:blob.type||"image/jpeg",cacheControl:"31536000"});fail(error);return{id:path}}};
async function sign(paths){const need=[...new Set(paths.filter(p=>p&&!URLS[p]))];
  for(let i=0;i<need.length;i+=100){const{data,error}=await SB.storage.from("photos").createSignedUrls(need.slice(i,i+100),60*60*6);
    if(!error&&data)for(const x of data)if(x.signedUrl)URLS[x.path]=x.signedUrl}}
function visiblePaths(){const out=[];for(const p of S.people){out.push(p.portraitThumb||p.portrait)}
  for(const m of S.memories){for(const ph of(m.photos||[]))out.push(prev(m,ph))}return out}
async function reload(){
  const[pp,mm,ss]=await Promise.all([SB.from("people").select("id,data"),SB.from("memories").select("id,data"),SB.from("site").select("id,data").eq("id","main").maybeSingle()]);
  if(pp.error||mm.error){S.offline=true;render();return}
  S.people=pp.data.map(r=>({id:r.id,...r.data}));S.memories=mm.data.map(r=>({id:r.id,...r.data}));
  if(ss.data&&ss.data.data)S.site={title:ss.data.data.title||"Onze familie",subtitle:ss.data.data.subtitle||""};
  await sign(visiblePaths());S.ready.p=S.ready.m=true;render()}

  $("#af").onsubmit=async e=>{e.preventDefault();const em=$("#a-mail").value.trim().toLowerCase();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){st("a-st","Vul een geldig e-mailadres in.",1);return}
    const{error}=await SB.from("members").upsert({email:em,role:$("#a-role").value});if(error){st("a-st",errText(error),1);return}
    $("#a-mail").value="";st("a-st",em+" heeft nu toegang. Stuur diegene de link van het album.");draw()};
}

/* ---------- boot ---------- */
async function boot(){
  const h=location.hash.match(/^#p-([A-Za-z0-9_~.\-]+)$/);if(h)S.view=h[1];
  if(!window.supabase||!CFG.url||!CFG.anonKey){S.offline=true;S.offlineHTML='<section class="empty"><div><h1>Het album is nog niet ingesteld</h1><p>De verbinding met de opslag ontbreekt in config.js.</p></div></section>';render();return}
  SB=window.supabase.createClient(CFG.url,CFG.anonKey,{auth:{persistSession:true,detectSessionInUrl:true,flowType:"pkce"}});
  S.db=DB;S.assets=null;
  const{data:{session}}=await SB.auth.getSession();
  if(!session){S.gate=gateLogin(new URLSearchParams(location.search).get("error_description")||"");render();return}
  S.user=session.user;
  const{data:role,error}=await SB.rpc("my_role");
  if(error){S.offline=true;render();return}
  if(!role){S.gate=gateDenied(S.user.email);render();return}
  S.role=role;S.canEdit=role==="admin"||role==="editor";if(S.canEdit)S.assets=STORE;
  if(/[?&](code|error)=/.test(location.search))try{history.replaceState(null,"",location.pathname+location.hash)}catch(e){}
  await reload();
  setInterval(()=>{for(const k in URLS)delete URLS[k];sign(visiblePaths()).then(render)},1000*60*60*5);
}
boot();
})();
</script>
